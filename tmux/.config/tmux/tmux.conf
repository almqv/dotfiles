# General settings
set -g mouse on
set -g default-terminal "tmux-256color"
set -g default-shell /bin/zsh
set -g default-command /bin/zsh
set -g history-limit 5000
set -g status-keys vi
setw -g mode-keys vi

# Terminal capabilities / truecolor
#
# Prefer terminal-features over the older Tc terminal-overrides form.
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-ghostty:RGB"

# Allow terminal passthrough sequences.
# Useful for applications such as Codex that query terminal capabilities.
set -g allow-passthrough on

# Prefix: Ctrl-s
set -g prefix C-s
unbind C-b
bind C-s send-prefix

# Standard window bindings
bind c new-window
bind l last-window

# Start window numbering at 1
set -g base-index 1

# Ctrl-s r refreshes; Ctrl-s R reloads config
bind r refresh-client
bind R source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Custom prefix bindings
bind-key ö last-window
bind-key e send-prefix

# Vim-like pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key L select-pane -R

# Splits
bind '"' split-window
bind % split-window -h
bind å split-window -h
bind ä split-window -v


# ─────────────────────────────────────────────────────────────
# Status bar
#
# Stick to `default` and ANSI colours (colour0-colour15).
# Ghostty remaps these when its light/dark theme changes.
# Avoid colour16-colour255 for anything intended to track themes.
# ─────────────────────────────────────────────────────────────

set-option -g status on
set-option -g status-position bottom
set-option -g status-style "bg=default,fg=default"

set-option -g status-left ""
set-option -g status-right "#[fg=colour4,bold] %Y-%m-%d #[fg=colour6,bold]%H:%M:%S "
set-option -g status-right-length 50
set-option -g status-left-length 20

# Pane borders
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour4"

# Window status
set-window-option -g window-status-style "bg=default,fg=colour8"
set-window-option -g window-status-current-style "bg=default,fg=default"

set-window-option -g window-status-current-format \
    " #[fg=colour4,bold]#I#[fg=colour8]:#[fg=default,bold]#W#[fg=colour6]#F "

set-window-option -g window-status-format \
    " #I#[fg=colour8]:#W#F "

# Messages and copy mode
set -g message-style "bg=default,fg=colour4"
set -g message-command-style "bg=default,fg=colour4"
set -g mode-style "reverse"
