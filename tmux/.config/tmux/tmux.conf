# Converted from programs.tmux in nix-darwin/home.nix.

# General settings
set -g mouse on
set -g default-terminal "xterm-256color"
set -g default-shell /bin/zsh
set -g default-command /bin/zsh
set -g history-limit 5000
set -g status-keys vi
setw -g mode-keys vi

# Prefix: Ctrl-s
set -g prefix C-s
unbind C-b
bind C-s send-prefix

# Keep the standard tmux window bindings under the Ctrl-s prefix.
# In particular: Ctrl-s c creates a new window (tab).
bind c new-window
bind l last-window

# Start window numbering at 1
set -g base-index 1

# Keep the standard Ctrl-s r refresh binding; reload with Ctrl-s R.
bind r refresh-client
bind R source-file ~/.config/tmux/tmux.conf

# Custom prefix bindings
bind-key ö last-window
bind-key e send-prefix

# Vim-like pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key L select-pane -R

# Standard split bindings, with Swedish aliases as extras
bind '"' split-window
bind % split-window -h
bind å split-window -h
bind ä split-window -v

# Status bar configuration
#
# Everything below sticks to `default` (the terminal's own fg/bg) and the
# 16 ANSI colours (colour0-colour15). Terminal themes remap those 16 when you
# switch between light and dark, so the bar follows along with no reload.
# Avoid colour16-colour255: that cube is fixed and never adapts.
set-option -g status on
set-option -g status-position bottom
set-option -g status-style "bg=default,fg=default"
set-option -g status-left ""
set-option -g status-right "#[fg=colour4,bold] %Y-%m-%d #[fg=colour6,bold]%H:%M:%S "
set-option -g status-right-length 50
set-option -g status-left-length 20
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour4"

# Window status styling
set-window-option -g window-status-style "bg=default,fg=colour8"
set-window-option -g window-status-current-style "bg=default,fg=default"
set-window-option -g window-status-current-format " #[fg=colour4,bold]#I#[fg=colour8]:#[fg=default,bold]#W#[fg=colour6]#F "
set-window-option -g window-status-format " #I#[fg=colour8]:#W#F "

# Messages, prompts and copy-mode selection follow the terminal too.
# `reverse` literally swaps the terminal's own fg/bg, so it inverts correctly
# in both light and dark themes.
set -g message-style "bg=default,fg=colour4"
set -g message-command-style "bg=default,fg=colour4"
set -g mode-style "reverse"

# Truecolor support
set-option -sa terminal-overrides ",xterm*:Tc"
