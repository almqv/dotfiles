[colors]
draw_bold_text_with_bright_colors = true

# NvChad gruvchad (base46), same as nvim. The 16 ANSI colors follow
# base46/term.lua, which nvim uses for its own :terminal.
[colors.primary]
background = "#1e2122" # base00
foreground = "#c0b196" # base05

[colors.cursor]
text = "#1e2122"
cursor = "#c0b196"

[colors.vi_mode_cursor]
text = "#1e2122"
cursor = "#c0b196"

[colors.selection] # Visual
text = "CellForeground"
background = "#36393a" # base02

[colors.search.matches] # Search
foreground = "#2c2f30" # base01
background = "#e0c080" # base0A

[colors.search.focused_match] # IncSearch
foreground = "#2c2f30" # base01
background = "#e78a4e" # base09

[colors.footer_bar] # statusline
foreground = "#c0b196"
background = "#222526"

[colors.normal]
black = "#2c2f30"   # base01
red = "#ec6b64"     # base08
green = "#a9b665"   # base0B
yellow = "#e0c080"  # base0A
blue = "#7daea3"    # base0D
magenta = "#d3869b" # base0E
cyan = "#86b17f"    # base0C
white = "#c0b196"   # base05

[colors.bright]
black = "#404344"   # base03
red = "#ec6b64"
green = "#a9b665"
yellow = "#e0c080"
blue = "#7daea3"
magenta = "#d3869b"
cyan = "#86b17f"
white = "#c7b89d"   # base07

[cursor]
style = "Block"

[env]
TERM = "xterm-256color"

[font]
size = 6.5

[font.bold]
family = "FiraCode Nerd Font"
style = "Bold"

[font.bold_italic]
family = "FiraCode Nerd Font"
style = "Bold Italic"

[font.italic]
family = "FiraCode Nerd Font"
style = "Italic"

[font.normal]
family = "FiraCode Nerd Font"
style = "Normal"

[[keyboard.bindings]]
action = "Paste"
key = "V"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "Copy"
key = "C"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "PasteSelection"
key = "Insert"
mods = "Shift"

[[keyboard.bindings]]
action = "ResetFontSize"
key = "Key0"
mods = "Control"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "Equals"
mods = "Control"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "Plus"
mods = "Control"

[[keyboard.bindings]]
action = "DecreaseFontSize"
key = "Minus"
mods = "Control"

[[keyboard.bindings]]
action = "DecreaseFontSize"
key = "Minus"
mods = "Control"

[[keyboard.bindings]]
action = "Paste"
key = "Paste"

[[keyboard.bindings]]
action = "Copy"
key = "Copy"

[[keyboard.bindings]]
action = "ClearLogNotice"
key = "L"
mods = "Control"

[[keyboard.bindings]]
chars = "\f"
key = "L"
mods = "Control"

[[keyboard.bindings]]
action = "ScrollPageUp"
key = "PageUp"
mode = "~Alt"
mods = "Shift"

[[keyboard.bindings]]
action = "ScrollPageDown"
key = "PageDown"
mode = "~Alt"
mods = "Shift"

[[keyboard.bindings]]
action = "ScrollToTop"
key = "Home"
mode = "~Alt"
mods = "Shift"

[[keyboard.bindings]]
action = "ScrollToBottom"
key = "End"
mode = "~Alt"
mods = "Shift"

[scrolling]
history = 5000

[window]
opacity = 1.0
title = "Terminal"

[window.class]
general = "Alacritty"
instance = "Alacritty"

[window.padding]
x = 8
y = 8

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
