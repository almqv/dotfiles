[colors]
draw_bold_text_with_bright_colors = true

# NvChad onenord (base46), same as nvim. The 16 ANSI colors follow
# base46/term.lua, which nvim uses for its own :terminal.
[colors.primary]
background = "#2a303c" # base00
foreground = "#bfc5d0" # base05

[colors.cursor]
text = "#2a303c"
cursor = "#bfc5d0"

[colors.vi_mode_cursor]
text = "#2a303c"
cursor = "#bfc5d0"

[colors.selection] # Visual
text = "CellForeground"
background = "#434C5E" # base02

[colors.search.matches] # Search
foreground = "#3B4252" # base01
background = "#EBCB8B" # base0A

[colors.search.focused_match] # IncSearch
foreground = "#3B4252" # base01
background = "#e39a83" # base09

[colors.footer_bar] # statusline
foreground = "#bfc5d0"
background = "#333945"

[colors.normal]
black = "#3B4252"   # base01
red = "#d57780"     # base08
green = "#A3BE8C"   # base0B
yellow = "#EBCB8B"  # base0A
blue = "#81A1C1"    # base0D
magenta = "#B48EAD" # base0E
cyan = "#97b7d7"    # base0C
white = "#bfc5d0"   # base05

[colors.bright]
black = "#4C566A"   # base03
red = "#d57780"
green = "#A3BE8C"
yellow = "#EBCB8B"
blue = "#81A1C1"
magenta = "#B48EAD"
cyan = "#97b7d7"
white = "#ced4df"   # base07

[cursor]
style = "Block"

[env]
TERM = "xterm-256color"

[font]
size = 6.5

[font.bold]
family = "FiraCode Nerd Font"
style = "Bold"

[font.bold_italic]
family = "FiraCode Nerd Font"
style = "Bold Italic"

[font.italic]
family = "FiraCode Nerd Font"
style = "Italic"

[font.normal]
family = "FiraCode Nerd Font"
style = "Normal"

[[keyboard.bindings]]
action = "Paste"
key = "V"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "Copy"
key = "C"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "PasteSelection"
key = "Insert"
mods = "Shift"

[[keyboard.bindings]]
action = "ResetFontSize"
key = "Key0"
mods = "Control"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "Equals"
mods = "Control"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "Plus"
mods = "Control"

[[keyboard.bindings]]
action = "DecreaseFontSize"
key = "Minus"
mods = "Control"

[[keyboard.bindings]]
action = "DecreaseFontSize"
key = "Minus"
mods = "Control"

[[keyboard.bindings]]
action = "Paste"
key = "Paste"

[[keyboard.bindings]]
action = "Copy"
key = "Copy"

[[keyboard.bindings]]
action = "ClearLogNotice"
key = "L"
mods = "Control"

[[keyboard.bindings]]
chars = "\f"
key = "L"
mods = "Control"

[[keyboard.bindings]]
action = "ScrollPageUp"
key = "PageUp"
mode = "~Alt"
mods = "Shift"

[[keyboard.bindings]]
action = "ScrollPageDown"
key = "PageDown"
mode = "~Alt"
mods = "Shift"

[[keyboard.bindings]]
action = "ScrollToTop"
key = "Home"
mode = "~Alt"
mods = "Shift"

[[keyboard.bindings]]
action = "ScrollToBottom"
key = "End"
mode = "~Alt"
mods = "Shift"

[scrolling]
history = 5000

[window]
opacity = 1.0
title = "Terminal"

[window.class]
general = "Alacritty"
instance = "Alacritty"

[window.padding]
x = 8
y = 8

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
